schema_version: 1

context:
  number: 6

recipe:
  name: microarch-level-split
  version: ${{ level }}

build:
  number: ${{ number }}
  noarch: generic

outputs:
  - package:
      name: _${{ family }}-microarch-level
    build:
      string: ${{ number }}_${{ build_tag }}
      variant:
        # The legacy per-name builds are down-prioritized via auto-generated
        # track_features so that solvers which can match the CEP 29 regex
        # build string prefer the per-level builds.
        down_prioritize_variant: ${{ legacy }}
    requirements:
      run:
        # The build matcher is either an exact microarchitecture name (legacy
        # per-name build) or a CEP 29 regex matching every name of this level
        # or higher in the family (per-level build); see gen.py.
        - "__archspec[version='1.*', build='${{ archspec_build }}']"
    tests:
      # An installation test is not possible: the test environment could only
      # be solved on a CI machine whose CPU matches the __archspec constraint.
      # Assert instead that the metapackage is empty.
      - package_contents:
          strict: true
    about:
      homepage: https://github.com/conda-forge/microarch-level-feedstock
      summary: 'Meta package to build conda recipes with microarchitecture levels'
      description: |
        The meta-package _${{ family }}-microarch-level enforces the microarchitecture in the
        user system.

        Note that a user would need the archspec conda package installed
        in the base environment where conda/mamba is run from.
        Note also that this package is not intended to be directly interacted
        with by users.

        See ${{ family }}-microarch-level for using this in conda recipes
      license: BSD-3-Clause
      license_file: LICENSE.txt

  - package:
      name: ${{ family }}-microarch-level
    build:
      string: ${{ number }}_level${{ level }}
      script:
        interpreter: python
        file: install_scripts.py
        env:
          MICROARCH_FAMILY: ${{ family }}
          MICROARCH_LEVEL: ${{ level }}
    requirements:
      build:
        - python
      run_exports:
        strong:
          - _${{ family }}-microarch-level >=${{ level }}
    tests:
      # The Windows scripts cannot run on the Linux CI that builds these
      # noarch packages; package_contents inspects the artifact instead.
      - package_contents:
          files:
            - etc/conda/activate.d/~activate-${{ family }}-level.sh
            - etc/conda/deactivate.d/~deactivate-${{ family }}-level.sh
            - if: family == "x86_64"
              then:
                - etc/conda/activate.d/~activate-${{ family }}-level.bat
                - etc/conda/deactivate.d/~deactivate-${{ family }}-level.bat
                - etc/conda/activate.d/~activate-${{ family }}-level.ps1
                - etc/conda/deactivate.d/~deactivate-${{ family }}-level.ps1
    about:
      homepage: https://github.com/conda-forge/microarch-level-feedstock
      summary: 'Meta package to build conda recipes with microarchitecture levels'
      description: |
        Use the meta-package ${{ family }}-microarch-level in requirements/build in conda
        recipes to set up the compiler flags and set up the virtual package
        requirements in the run requirements.

        When building packages on CI, level=4 will not be guaranteed, so
        you can only use level<=3 to build.

        The run_exports only has a lower bound and therefore a level=2
        build can be installed on a level=3 user system. A tighter bound
        is not added because we want to be able to test both level=2 and
        level=3 on a CI machine with level=3.
        Therefore in order to prioritise the highest level, use the build
        number to prioritise the level.

        In [rare circumstances](https://github.com/conda-forge/microarch-level-feedstock/issues/13#issuecomment-2551385113)
        where a particular level needs to be forced, this can be achieved by
        overriding the `__archspec`
        [virtual package](https://docs.conda.io/projects/conda/en/stable/user-guide/tasks/manage-virtual.html)
        by setting the `CONDA_OVERRIDE_ARCHSPEC` environment variable during
        the environment solve.
        For example, setting `CONDA_OVERRIDE_ARCHSPEC=x86_64` will force
        level=1. For levels higher than 1 `CONDA_OVERRIDE_ARCHSPEC=x86_64_vx`
        will force level=x. For example, `CONDA_OVERRIDE_ARCHSPEC=x86_64_v2`
        will force level=2.
        Note that no checks will be done to ensure that the level is viable.

        The activation scripts also append `-Ctarget-cpu=<level>` to
        RUSTFLAGS, so cargo/rustc builds target the selected level as well.

        On Windows (x86_64 only), the activation scripts append MSVC-style
        flags instead: `/arch:AVX2` for level 3 and `/arch:AVX512` for
        level 4. These are only applied when `CC` is `cl` or `clang-cl`,
        so other toolchains do not receive flags in a syntax they cannot
        parse. Levels 1 and 2 set no C/C++ flags on Windows: MSVC's x64
        baseline already targets level 1 and there is no MSVC flag for
        the level 2 feature set. RUSTFLAGS is set for every level on
        Windows regardless of `CC`, since rustc is LLVM-based and not
        subject to these limitations; this is also why level 2 is
        installable on Windows, unlike in the C/C++-only predecessor of
        this build.
        Windows users need conda >= 24.3.0, mamba 2.x
        with Windows archspec support, or pixi for the `__archspec` virtual
        package to report the CPU microarchitecture; older solvers report
        level 1.
      license: BSD-3-Clause
      license_file: LICENSE.txt

about:
  homepage: https://github.com/conda-forge/microarch-level-feedstock
  summary: 'Meta package to build conda recipes with microarchitecture levels'
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  feedstock-name: microarch-level
  recipe-maintainers:
    - isuruf
